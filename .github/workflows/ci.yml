name: CI

# Runs on every PR and on pushes to main. The deploy job at the bottom is what actually
# ships to Render -- `render.yaml` has autoDeploy disabled precisely so that a push to
# main cannot deploy without these checks passing first.
on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the in-flight run obsolete. Never cancel a run on
# main, though: the deploy job hangs off it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned to an exact version: setup-uv stopped publishing a floating major tag
        # after v7, so `@v9` does not resolve.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      # pyproject.toml already sets --cov-fail-under=100 with branch coverage, so this
      # step is the coverage gate as well as the test run.
      - name: Test
        run: uv run pytest

      # Python owns card behaviour; packages/core mirrors it in TypeScript. This fails
      # if the checked-in corpus no longer matches what Python produces -- which catches
      # both "a formula changed" and "a card was added". The TypeScript side is then
      # checked against that corpus by the frontend job.
      - name: Check the parity corpus is current
        run: uv run python tools/generate_parity_corpus.py --check

  frontend:
    name: Frontend (tsc, oxlint, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # One install for the whole workspace; npm links @mtg/core into apps/web.
      - name: Install dependencies
        run: npm ci

      # tokens.css is generated from tokens.ts. Regenerating locally is wired to
      # predev/prebuild, but nothing stops a commit that edits tokens.ts alone -- this
      # catches that before the stale CSS ships.
      - name: Check design tokens are current
        run: npm run tokens:check -w @mtg/web

      - name: Type check
        run: npm run typecheck --workspaces --if-present

      - name: Lint
        run: npm run lint

      # Each package sets its own 100% thresholds on lines/branches/functions/statements.
      - name: Test core
        run: npx vitest run --coverage
        working-directory: packages/core

      - name: Test web
        run: npx vitest run --coverage
        working-directory: apps/web

  docker-e2e:
    name: E2E (Docker image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The jobs above never build the image, so nothing else in CI would notice a
      # Dockerfile that produces a container serving 404s -- /healthz stays green
      # because it is a FastAPI route that does not touch the frontend at all.
      - name: Build the production image
        run: docker build -t mtg-calc:ci .

      - name: Start the container
        run: docker run -d --name mtg-calc-ci -p 8080:8080 mtg-calc:ci

      - name: Wait for the health check
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:8080/healthz > /dev/null; then
              echo "Container healthy after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Container never became healthy"
          docker logs mtg-calc-ci
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:8080

      # Traces and screenshots are the only way to diagnose a CI-only E2E failure.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Container logs on failure
        if: failure()
        run: docker logs mtg-calc-ci

# There is deliberately no deploy job. `render.yaml` sets
# `autoDeployTrigger: checksPass`, so Render watches the GitHub Checks API and deploys
# a commit on main once these jobs are green -- no deploy hook, and therefore no
# long-lived credential in repo secrets to leak or rotate.
#
# Consequence: every check reported on a commit gates the deploy, not a chosen subset.
# Keep slow or flaky jobs (mobile E2E) off the push-to-main trigger.
